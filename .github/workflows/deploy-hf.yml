name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'hf-deploy/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Sync Backend Files to hf-deploy
        run: |
          # Clean up old routers folder if exists to avoid stale files
          rm -rf hf-deploy/routers
          
          # Copy main server files
          cp backend/server.py hf-deploy/
          cp backend/requirements.txt hf-deploy/
          cp backend/database.py hf-deploy/
          cp backend/models.py hf-deploy/
          cp backend/auth.py hf-deploy/
          cp backend/startup.py hf-deploy/
          
          # Copy modular routers directory
          cp -r backend/routers hf-deploy/

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "huggingface_hub[cli]"
          # Gunakan hf upload dengan syntax --key=value untuk menghindari error argumen ekstra
          hf upload mit147a/budgetwise-api ./hf-deploy . --repo-type=space --token=$HF_TOKEN --commit-message="Auto-deploy: sync backend to Hugging Face"
