name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hf.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Hugging Face Dockerfile
        run: |
          # Override Dockerfile khusus untuk Hugging Face Spaces agar berjalan sbg non-root
          # Langkah ini tidak akan merusak Dockerfile asli di repo GitHub karena hanya berjalan di Runner CI
          cat << 'EOF' > backend/Dockerfile
          FROM python:3.11-slim
          RUN useradd -m -u 1000 user
          USER user
          ENV HOME=/home/user \
              PATH=/home/user/.local/bin:$PATH
          WORKDIR /app
          COPY --chown=user requirements.txt .
          RUN pip install --no-cache-dir --upgrade -r requirements.txt
          COPY --chown=user . /app
          EXPOSE 7860
          CMD ["gunicorn", "server:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--workers", "2", "--bind", "0.0.0.0:7860", "--timeout", "120", "--keep-alive", "5", "--access-logfile", "-"]
          EOF

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "huggingface_hub[cli]"
          # Langsung upload folder backend tanpa perlu folder replika hf-deploy
          hf upload mit147a/budgetwise-api ./backend . --repo-type=space --token=$HF_TOKEN --commit-message="Auto-deploy: sync backend to Hugging Face"
